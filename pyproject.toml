[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kakaorm"
version = "0.4.6"
description = "Async-native ORM for PostgreSQL, SQLite, and MySQL/MariaDB"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ayumu Takai", email = "ayumu.takai@gmail.com" }]
requires-python = ">=3.11"
keywords = ["orm", "async", "asyncio", "postgresql", "sqlite", "mysql", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
asyncpg  = ["asyncpg>=0.29"]
aiosqlite = ["aiosqlite>=0.20"]
aiomysql = ["aiomysql>=0.2"]
psycopg3 = ["psycopg[binary]>=3.1", "psycopg-pool>=3.1"]
cli = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]
all = [
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.4",
]

[project.scripts]
kakaorm = "kakaorm.cli:main"

[project.urls]
Homepage   = "https://github.com/AyumuTakai/kakaorm"
Repository = "https://github.com/AyumuTakai/kakaorm"
Issues     = "https://github.com/AyumuTakai/kakaorm/issues"

[tool.hatch.build.targets.wheel]
packages = ["kakaorm"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/", "docs/", "examples/", "mnt/", ".claude/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
